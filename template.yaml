AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ESPN fantasy football site - data-generation Lambda + schedule (backend
  half of the espn-ff-s3-site stack). See .claude/DESIGN.md for the full
  architecture.

  NOTE - this file is shared between the backend and frontend halves of
  the work (.claude/TODO-backend.md / .claude/TODO-frontend.md). The Lambda-side resources
  (function, layer, execution role, Secrets Manager secret, EventBridge
  Scheduler) are backend's; the S3 site bucket, its public-read bucket
  policy, WebsiteConfiguration, and Block Public Access settings (see the
  "Static site bucket" section below) are frontend's, per .claude/TODO-frontend.md's
  "Infrastructure" section. Collapsed into one stack: the bucket resource's
  BucketName is !Ref SiteBucketName, the same parameter the Lambda-side IAM
  policies already !Sub-reference, so both halves resolve to the same bucket
  name without the Lambda-side resources needing to change at all.

Parameters:
  SiteBucketName:
    Type: String
    Description: >
      Name of the S3 site bucket. Also used as this template's
      AWS::S3::Bucket resource's explicit BucketName (see the "Static site
      bucket" section below) - a Parameter rather than letting
      CloudFormation generate the name so the Lambda-side IAM policies below
      (which predate the bucket resource) and the deploy-time
      `aws s3 sync`/`cp` commands can all reference a stable, predictable
      name. Must be globally unique across all of S3.

  PandasLayerArn:
    Type: String
    Description: >
      ARN of the AWS-managed AWSSDKPandas-Python311 layer for the target
      region/account. This is intentionally NOT defaulted - the AWS-owned
      publisher account ID and version number vary by region and change
      over time, so a stale hardcoded default would silently ship the wrong
      (or a since-deleted) layer version. Look up the current one for your
      region with:
        aws lambda list-layers --region <region> --compatible-runtime python3.11 \
          --query "Layers[?LayerName=='AWSSDKPandas-Python311'].LatestMatchingVersion.LayerVersionArn"
      or see https://docs.aws.amazon.com/lambda/latest/dg/python-package.html#python-package-sdk-pandas

  EspnSwid:
    Type: String
    NoEcho: true
    Description: >
      ESPN "swid" session cookie (from ignore/espn_creds.json locally).
      Supplied at deploy time (e.g. `sam deploy --parameter-overrides
      EspnSwid=... EspnEspnS2=...`), never committed to git or defaulted
      here.

  EspnEspnS2:
    Type: String
    NoEcho: true
    Description: ESPN "espn_s2" session cookie. Same handling as EspnSwid above.

  FunctionName:
    Type: String
    Default: espn-ff-data-generator
    Description: >
      Named explicitly (rather than left to CloudFormation's generated
      name) so the IAM role's log-group-scoped policy below can reference
      it without a circular dependency on the function's own ARN.

      Changing this default is a CloudFormation *replacement* (recreates the
      function, its role, log group, and the espn-creds secret name below) -
      don't change it as a side effect of a routine deploy.

  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: >
      EventBridge Scheduler state for WeeklyDataRefreshSchedule. Defaults to
      ENABLED - today's production behavior, unchanged for the existing
      stack unless this is explicitly overridden. Override to DISABLED for
      a second, parallel stack (see Makefile's deploy-branch target and
      .claude/DESIGN-incremental-espn-pipeline.md's live-shadow validation
      step) so a feature-branch deploy never runs its own unattended weekly
      ESPN pull on top of production's - that stack's Lambda is still fully
      invokable by name/`aws lambda invoke` for manual live testing, only
      the automatic trigger is off. This is a smaller, single-schedule
      stand-in for the ScheduleState parameter .claude/DESIGN.md decision
      #10 already planned for the eventual live/weekly-tier schedule split
      (.claude/TODO-backend.md "Incremental data generation") - not a
      replacement for that, just pulled forward because parallel-stack
      deploys need it now.

Resources:
  # --- Static site bucket (frontend-owned; .claude/TODO-frontend.md "Infrastructure") ----
  # Plain S3 static website hosting, no CloudFront/OAC (.claude/DESIGN.md decision #1) -
  # public HTTP endpoint, public-read bucket policy below instead of signed
  # URLs/a CDN origin access control.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SiteBucketName
      # ErrorDocument: no dedicated error page exists yet (not decided as of
      # this pass) - reusing index.html means a missing/mistyped path still
      # renders the app shell (which then just shows empty tables) instead of
      # S3's raw XML error output. Worth revisiting if a real 404 page is
      # ever wanted; noted in .claude/DESIGN.md.
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      # Bucket policy (below) grants public s3:GetObject - that's a bucket
      # *policy*, not an ACL, so only BlockPublicPolicy/RestrictPublicBuckets
      # need to be turned off. BlockPublicAcls/IgnorePublicAcls stay on
      # (the account-level default) since this bucket never uses ACLs.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${SiteBucket}/*"

  # --- Secrets Manager -----------------------------------------------
  # ESPN credentials never go in S3 or git (see project memory / .claude/DESIGN.md
  # decision #4) - Secrets Manager only. Values come from NoEcho parameters
  # supplied at `sam deploy` time rather than a manual out-of-band
  # `aws secretsmanager create-secret` call, so the whole stack (secret
  # included) stands up from one `sam deploy`. NoEcho masks the values in
  # the CloudFormation console/CLI output; they're still retrievable via
  # secretsmanager:GetSecretValue by anyone with that IAM permission, same
  # as a secret created any other way - that's expected, not a leak.
  EspnCredsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${FunctionName}-espn-creds"
      Description: ESPN swid/espn_s2 session cookies for the espn-ff-s3-site data-generator Lambda.
      SecretString: !Sub '{"swid":"${EspnSwid}","espn_s2":"${EspnEspnS2}"}'

  # --- Lambda ----------------------------------------------------------
  DataGeneratorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: 90

  DataGeneratorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteDataFiles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # s3:PutObject scoped to exactly the 8 files the Lambda
              # writes (.claude/DESIGN.md decision #7's table) - NOT a bucket-wide
              # or prefix wildcard. The bucket root is a flat namespace
              # shared with index.html/style.css/league_config.json (which
              # this Lambda never writes), so prefix scoping can't
              # distinguish them; only an explicit key list can.
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${SiteBucketName}/league_history.csv"
                  - !Sub "arn:aws:s3:::${SiteBucketName}/head_to_head_lifetime.csv"
                  - !Sub "arn:aws:s3:::${SiteBucketName}/advanced_team_metrics.csv"
                  - !Sub "arn:aws:s3:::${SiteBucketName}/all_time_records.csv"
                  - !Sub "arn:aws:s3:::${SiteBucketName}/most_drafted_players.csv"
                  - !Sub "arn:aws:s3:::${SiteBucketName}/weekly_efficiency_awards.csv"
                  - !Sub "arn:aws:s3:::${SiteBucketName}/survivor_results.json"
                  - !Sub "arn:aws:s3:::${SiteBucketName}/weekly_payout_winners.json"
        - PolicyName: ReadConfig
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Config-source decision (.claude/DESIGN.md decision #4 / .claude/TODO-backend.md):
              # league_config.json is read from the bucket root - the same
              # public object the frontend deploy step publishes for the
              # browser to fetch, so there's one copy, not two. owner_map.json
              # and weekly_payouts_config.json (not front-end-facing) live
              # under a separate config/ prefix in the same bucket.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${SiteBucketName}/league_config.json"
                  - !Sub "arn:aws:s3:::${SiteBucketName}/config/owner_map.json"
                  - !Sub "arn:aws:s3:::${SiteBucketName}/config/weekly_payouts_config.json"
        - PolicyName: ReadWriteLeaguesPrefix
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DESIGN.md decision #12's leagues/* grant, pulled forward from
              # TODO-backend.md's not-yet-built "Multi-league support" item -
              # needed now (not later) by the _v2 shadow steps
              # (DESIGN-incremental-espn-pipeline.md decision #13): the
              # per-year cache (league_reports/cache.py), the shared raw
              # box-score cache (league_reports/box_score_cache.py), and the
              # shadow/ publish prefix all live under
              # leagues/<league_id>/... - none of which the explicit-key
              # WriteDataFiles/ReadConfig policies above cover, since those
              # predate decision #12/#13 and only know about the flat
              # bucket-root filenames. Discovered missing by actually
              # deploying and invoking a parallel branch stack (Makefile's
              # deploy-branch/invoke-branch) - every _v2 step failed with
              # AccessDenied against a real IAM role until this was added,
              # something the local scratch-bucket testing this branch had
              # relied on until now couldn't catch, since that ran under a
              # much broader IAM user, not this role. `leagues/` (not a bare
              # prefix wildcard off the bucket root) is deliberate, same
              # reasoning as decision #12: one unambiguous prefix to grant
              # against, no risk of colliding with index.html/style.css/a
              # future top-level frontend asset.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub "arn:aws:s3:::${SiteBucketName}/leagues/*"
              # s3:ListBucket, scoped to the leagues/ prefix via the
              # s3:prefix condition (ListBucket is always a bucket-ARN
              # action, never an object-ARN one, hence no /leagues/* here).
              # Without this, GetObject against a key that doesn't exist yet
              # (the normal, expected case for a first-ever cache read - see
              # league_reports/cache.py's/box_score_cache.py's NoSuchKey
              # handling) comes back as 403 AccessDenied instead of 404
              # NoSuchKey, because S3 won't confirm-or-deny a key's
              # existence to a caller with no ListBucket permission at all.
              # cache.py/box_score_cache.py only ever special-case NoSuchKey/
              # 404 as "not cached yet, compute it" - an AccessDenied instead
              # propagates as a real error, which every _v2 step's per-year/
              # per-week try/except then quietly swallows as "skip this
              # year/week" rather than falling back to computing it. Found
              # exactly this way: a real deploy-branch + invoke-branch run
              # silently dropped every closed year's data before this was
              # added, something no amount of local scratch-bucket testing
              # under a broader IAM user could have surfaced.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${SiteBucketName}"
                Condition:
                  StringLike:
                    s3:prefix: "leagues/*"
        - PolicyName: ReadEspnCreds
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref EspnCredsSecret
        - PolicyName: WriteOwnLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: logs:*
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*"

  DataGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Description: >
        Weekly regeneration of the league site's CSV/JSON data files
        from ESPN. See .claude/DESIGN.md and .claude/TODO-backend.md.
      CodeUri: ./
      Handler: lambda_function.handler
      Runtime: python3.11
      Architectures:
        - x86_64
      # Generous starting point per .claude/TODO-backend.md - tune down once real
      # runtime is measured (see .claude/TODO-backend.md "Testing"); 900s is the
      # Lambda hard cap, so this leaves no further headroom to grow into
      # without the season-cache optimization (.claude/DESIGN.md decision #5).
      Timeout: 900
      # pandas + a full multi-year ESPN history in memory at once needs
      # more than the 128-512MB default; 1024MB is a starting point, not a
      # measured figure - revisit alongside the timeout once a real run has
      # been profiled.
      MemorySize: 1024
      Role: !GetAtt DataGeneratorExecutionRole.Arn
      Layers:
        - !Ref PandasLayerArn
      Environment:
        Variables:
          FF_CONFIG_BACKEND: s3
          FF_SITE_BUCKET: !Ref SiteBucketName
          FF_CONFIG_PREFIX: config/
          FF_ESPN_SECRET_NAME: !Ref EspnCredsSecret
    DependsOn: DataGeneratorLogGroup
    Metadata:
      # CodeUri is the whole repo root (lambda_function.py lives there per
      # .claude/DESIGN.md's target layout), and that root also holds ignore/ - real
      # ESPN swid/espn_s2 session cookies. sam build's default Python
      # builder has no user-configurable exclude list (its CopySource step
      # only skips a small hardcoded set - .git, .venv, __pycache__, etc -
      # and does NOT read a .samignore file, despite that being documented
      # as a general SAM CLI feature elsewhere; confirmed empirically and
      # by reading aws_lambda_builders' python_pip workflow source in this
      # SAM CLI version). So: a custom Makefile build (this Metadata block
      # + the Makefile at the repo root) with an explicit allow-list of
      # what to copy, instead of trying to deny-list everything that must
      # NOT ship - a deny-list only protects against files someone
      # remembered to add to it.
      BuildMethod: makefile

  # --- EventBridge Scheduler --------------------------------------------
  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${FunctionName}-scheduler-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeDataGeneratorLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DataGeneratorFunction.Arn

  WeeklyDataRefreshSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${FunctionName}-weekly"
      Description: >
        Weekly trigger, in-season. PLACEHOLDER: Tuesday 09:00 America/Chicago
        (after Monday Night Football) - confirm the exact day/time with
        Morrie before relying on this in prod (.claude/TODO-backend.md).
      ScheduleExpression: "cron(0 9 ? * TUE *)"
      ScheduleExpressionTimezone: America/Chicago
      FlexibleTimeWindow:
        Mode: "OFF"
      State: !Ref ScheduleState
      Target:
        Arn: !GetAtt DataGeneratorFunction.Arn
        RoleArn: !GetAtt SchedulerExecutionRole.Arn
        # Explicit Input rather than an empty event, per decision #10b's own
        # reasoning: a schedule shouldn't lean on the handler's DEFAULT_STEPS
        # fallback (that fallback exists for manual/console invokes). Kept
        # in sync with lambda_function.py's DEFAULT_STEPS by hand - matches
        # it exactly as of the decision #13 cutover (head_to_head_v2/
        # advanced_history_v2/weekly_summary_v2 in place of their legacy
        # counterparts; history/records stay legacy; owner_habits excluded).
        Input: '{"steps": ["history", "head_to_head_v2", "advanced_history_v2", "records", "weekly_summary_v2"]}'

Outputs:
  SiteBucketWebsiteURL:
    Description: >
      Public HTTP endpoint for the static site (S3 website hosting, no
      HTTPS - .claude/DESIGN.md decision #1). This is what a browser/curl hits, and
      what README.md should point at.
    Value: !GetAtt SiteBucket.WebsiteURL

  SiteBucketNameOutput:
    Description: >
      Name of the S3 site bucket - same value as the SiteBucketName
      parameter, exposed as a stack output so deploy scripts can look it up
      via `sam list stack-outputs` / `aws cloudformation describe-stacks`
      instead of hardcoding it.
    Value: !Ref SiteBucket

  DataGeneratorFunctionArn:
    Description: ARN of the data-generator Lambda.
    Value: !GetAtt DataGeneratorFunction.Arn

  EspnCredsSecretArn:
    Description: ARN of the ESPN creds secret (for manual inspection/rotation).
    Value: !Ref EspnCredsSecret
